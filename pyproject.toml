[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "splitrisk"
version = "0.2.1"
description = "Audit what your split model leaks — calibrated probe battery for representation-leakage measurement (SA-RI L1)"
readme = "README.md"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.9"
authors = [{name = "Tak Ho Alex Li", email = "alexlihk@hotmail.com"}]
keywords = ["privacy", "split learning", "split inference", "representation leakage", "audit", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
    "datasets>=2.14",
    "numpy",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
splitrisk = "splitrisk.cli:main"

[project.urls]
Homepage = "https://github.com/alexlihk/splitrisk"
Paper = "https://doi.org/10.13140/RG.2.2.32481.67681"

[tool.pytest.ini_options]
markers = ["slow: requires a model checkpoint or GPU"]
